[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hermes-openai-codex-web-provider"
version = "1.0.0"
description = "Standalone OpenAI Codex web-search provider for Hermes Agent"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maximilian Ghazanfar" }]
dependencies = [
  "hermes-agent>=0.20.6,<0.21",
  "httpx>=0.28,<0.29",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.entry-points."hermes_agent.plugins"]
openai-codex-web = "hermes_openai_codex_web_provider"

[project.urls]
Homepage = "https://github.com/mazzanfar/hermes-openai-codex-web-provider"
Repository = "https://github.com/mazzanfar/hermes-openai-codex-web-provider"

[tool.hatch.build.targets.wheel]
packages = ["hermes_openai_codex_web_provider"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
